name: Deploy the game to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # For cache-nix-action to delete the caches it replaces.
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # One known place for cabal's package index and store, so the store can be cached.
      - name: Set cabal directory
        run: echo "CABAL_DIR=$RUNNER_TEMP/cabal" >> "$GITHUB_ENV"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: max-jobs = auto

      # The wasm toolchain isn't on cache.nixos.org (Nix unpacks ghc-wasm-meta's
      # tarballs), so the Nix store is cached. It only holds the `wasm` dev shell:
      # the build uses cabal, which, unlike nixpkgs' Haskell builder, needs no
      # native GHC.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/wasm-haskell.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Before saving, collect everything but the dev shell (a GC root, see
          # below), e.g. an older toolchain restored from an older cache.
          gc-max-store-size-linux: 0
          # Delete the caches this one replaces.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Restore cabal store
        id: cabal-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CABAL_DIR }}/store
          # The GHC version comes from flake.lock, the dependency versions from
          # the index-state in cabal.project.release.
          key: cabal-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.release', '*.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      # Kept as a GC root, so the cache's garbage collection keeps the toolchain.
      - name: Get the wasm toolchain
        run: nix develop .#wasm --profile "$RUNNER_TEMP/wasm-shell" --command true

      - name: Build dependencies
        shell: nix develop .#wasm --command bash --noprofile --norc -eo pipefail {0}
        run: |
          wasm32-wasi-cabal update
          wasm32-wasi-cabal build --project-file=cabal.project.release --only-dependencies exe:mparkour2d

      # Saved right after the dependencies are built, so a failing game build does not throw them away.
      - name: Save cabal store
        if: steps.cabal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CABAL_DIR }}/store
          key: ${{ steps.cabal-cache.outputs.cache-primary-key }}

      - name: Build website
        shell: nix develop .#wasm --command bash --noprofile --norc -eo pipefail {0}
        run: |
          wasm32-wasi-cabal build --project-file=cabal.project.release exe:mparkour2d
          web/build-site.sh "$(wasm32-wasi-cabal list-bin --project-file=cabal.project.release exe:mparkour2d)" publish

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
