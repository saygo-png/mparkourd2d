<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mparkour2d</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; overflow: hidden; background: #000; }
      /* The game's canvases, stacked. */
      body > div { display: grid; }
      canvas { grid-area: 1 / 1; width: min(100vw, calc(100vh * 16 / 9)); }
    </style>
  </head>
  <body>
    <script type="module">
      // The game draws on the canvases miso adds to <body>, and uses Box2D through
      // the global `b2` (see src/Box2D.hs).
      import box2d from "./vendor/box2d3-wasm/Box2D.compat.mjs";
      import { WASI, OpenFile, File, ConsoleStdout } from "./vendor/browser_wasi_shim/index.js";
      import jsffi from "./ghc_wasm_jsffi.js";

      globalThis.b2 = await box2d();

      // Standard GHC wasm JSFFI loader; `start` is the game's `main`.
      const stdio = [new OpenFile(new File([])), ConsoleStdout.lineBuffered(console.log), ConsoleStdout.lineBuffered(console.error)];
      const wasi = new WASI([], [], stdio, { debug: false });
      const exports = {};
      const { instance } = await WebAssembly.instantiateStreaming(fetch("mparkour2d.wasm"), {
        wasi_snapshot_preview1: wasi.wasiImport,
        ghc_wasm_jsffi: jsffi(exports),
      });
      Object.assign(exports, instance.exports);
      wasi.initialize(instance);
      await instance.exports.start();
    </script>
  </body>
</html>
